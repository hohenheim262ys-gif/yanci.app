<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<meta name="description" content="考研英语一：查词、考频、词根，每天一篇包含你生词的范文。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="研词">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="stylesheet" href="css/app.css">
<title>研词 · 考研英语一</title>
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">研</span>
    <div class="brand-text">
      <h1>研词</h1>
      <p>考研英语一 · 每日一篇</p>
    </div>
  </div>
  <div class="top-actions">
    <button type="button" class="icon-btn" id="installBtn" hidden aria-label="安装到主屏">安装</button>
    <button type="button" class="icon-btn" id="themeBtn" aria-label="切换深浅色" title="切换深浅色">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main id="main">
  <section id="view-today" class="view on" aria-labelledby="todayTitle">
    <div class="page-head">
      <div>
        <p class="eyebrow" id="todayDate">今日</p>
        <h2 id="todayTitle">每日一篇</h2>
      </div>
      <div class="exam-pill" id="examPill">考研倒计时</div>
    </div>
    <div id="todayContent"><div class="hero-card"><div class="loading"><span class="spinner"></span>正在加载词库…</div></div></div>
  </section>

  <section id="view-search" class="view" aria-labelledby="searchTitle">
    <div class="page-head">
      <div>
        <p class="eyebrow">查词</p>
        <h2 id="searchTitle">遇到生词，查一下</h2>
      </div>
    </div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="search" inputmode="search" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入英文单词，或中文如「维持」">
      <button type="button" class="clear-btn" id="searchClear" hidden aria-label="清空">×</button>
    </div>
    <div id="searchResults" class="results"></div>
    <div id="searchHome" class="search-home"></div>
  </section>

  <section id="view-essay" class="view" aria-labelledby="essayTitle">
    <div class="page-head">
      <div>
        <p class="eyebrow">作文</p>
        <h2 id="essayTitle">框架 · 模板 · 范文</h2>
      </div>
    </div>
    <div class="seg" id="essayTabs" role="tablist">
      <button type="button" class="on" data-tab="templates" role="tab">小作文</button>
      <button type="button" data-tab="frameworks" role="tab">大作文</button>
      <button type="button" data-tab="samples" role="tab">真题范文</button>
      <button type="button" data-tab="topics" role="tab">主题语料</button>
      <button type="button" data-tab="roots" role="tab">词根</button>
    </div>
    <div class="search-box thin">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="essaySearch" type="search" autocomplete="off" placeholder="搜索模板、框架、范文、词根">
    </div>
    <div id="essayContent" class="essay-content"></div>
  </section>

  <section id="view-book" class="view" aria-labelledby="bookTitle">
    <div class="page-head">
      <div>
        <p class="eyebrow">生词本</p>
        <h2 id="bookTitle">积累的词</h2>
      </div>
      <div class="row">
        <button type="button" class="btn ghost sm" id="bookPdfImport">PDF 导入</button>
        <button type="button" class="btn ghost sm" id="bookExport">导出</button>
      </div>
    </div>
    <input type="file" id="pdfFile" accept="application/pdf,.pdf" hidden>
    <div id="bookStats" class="stats-row"></div>
    <div class="seg sm" id="bookSort" role="tablist">
      <button type="button" class="on" data-sort="due">待复现</button>
      <button type="button" data-sort="recent">最近</button>
      <button type="button" data-sort="freq">考频</button>
    </div>
    <div id="bookList" class="book-list"></div>
  </section>

  <section id="view-settings" class="view" aria-labelledby="settingsTitle">
    <div class="page-head">
      <div>
        <p class="eyebrow">设置</p>
        <h2 id="settingsTitle">按你的节奏来</h2>
      </div>
    </div>
    <div id="settingsContent"></div>
  </section>
</main>

<nav class="tabbar" aria-label="主导航">
  <button type="button" class="on" data-view="today" aria-label="今日">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>
    <span>今日</span>
  </button>
  <button type="button" data-view="search" aria-label="查词">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span>查词</span>
  </button>
  <button type="button" data-view="essay" aria-label="作文">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg>
    <span>作文</span>
  </button>
  <button type="button" data-view="book" aria-label="生词本">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
    <span>生词本</span>
  </button>
  <button type="button" data-view="settings" aria-label="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
    <span>设置</span>
  </button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close="1"></div>
  <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
    <div class="sheet-head">
      <h2 id="sheetTitle">词条</h2>
      <button type="button" class="icon-btn" id="sheetClose" aria-label="关闭">×</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </section>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="js/data/meta.js"></script>
<script src="js/data/words.js"></script>
<script src="js/data/essays.js"></script>
<script src="js/data/roots.js"></script>
<script src="js/app.js"></script>
</body>
</html>
